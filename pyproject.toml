[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telar"
version = "0.1.0"
description = "Cluster integration and control"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
telar = "telar.cli:main"

[tool.setuptools.packages.find]
include = ["telar*"]

[tool.setuptools.package-data]
telar = ["presets/*.json"]

[tool.setuptools.data-files]
"share/telar/node" = ["node/telar-node"]
